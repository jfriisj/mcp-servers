# Document Conversion Server Tool Schemas

convert_pdf_to_markdown:
  name: "convert_pdf_to_markdown"
  description: "Convert a PDF document to Markdown format with full formatting support"
  inputSchema:
    type: "object"
    properties:
      pdf_path:
        type: "string"
        description: "Path to the PDF file to convert"
      output_path:
        type: "string"
        description: "Path where the Markdown file should be saved"
      preserve_images:
        type: "boolean"
        description: "Whether to extract and save images from the PDF"
        default: true
      image_dir:
        type: "string"
        description: "Directory to save extracted images (if preserve_images is true)"
        default: "images"
    required: ["pdf_path", "output_path"]

quick_convert_pdf:
  name: "quick_convert_pdf"
  description: "Quickly convert a PDF to Markdown with basic formatting"
  inputSchema:
    type: "object"
    properties:
      pdf_path:
        type: "string"
        description: "Path to the PDF file to convert"
      output_path:
        type: "string"
        description: "Path where the Markdown file should be saved"
      skip_images:
        type: "boolean"
        description: "Skip image extraction for faster conversion"
        default: true
    required: ["pdf_path", "output_path"]

batch_convert_pdfs:
  name: "batch_convert_pdfs"
  description: "Convert multiple PDF files to Markdown format"
  inputSchema:
    type: "object"
    properties:
      input_dir:
        type: "string"
        description: "Directory containing PDF files to convert"
      output_dir:
        type: "string"
        description: "Directory where Markdown files should be saved"
      file_pattern:
        type: "string"
        description: "Pattern to match PDF files (e.g., '*.pdf')"
        default: "*.pdf"
      recursive:
        type: "boolean"
        description: "Search for PDFs in subdirectories"
        default: false
      preserve_structure:
        type: "boolean"
        description: "Maintain directory structure in output"
        default: true
      parallel:
        type: "boolean"
        description: "Process files in parallel"
        default: true
      max_workers:
        type: "integer"
        description: "Maximum number of parallel workers"
        default: 4
      preserve_images:
        type: "boolean"
        description: "Extract and save images from PDFs"
        default: true
    required: ["input_dir", "output_dir"]

# Common error responses for all tools
error_responses:
  validation_error:
    description: Input validation failed
    error_code: VALIDATION_ERROR
    http_status: 400
    schema:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Validation details
          properties:
            field:
              type: string
              description: Field that failed validation
            message:
              type: string
              description: Validation error message

  not_found_error:
    description: Requested resource not found
    error_code: NOT_FOUND
    http_status: 404
    schema:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          properties:
            resource_type:
              type: string
              description: Type of resource not found
            resource_id:
              type: string
              description: ID of resource not found

  permission_error:
    description: Permission denied
    error_code: PERMISSION_DENIED
    http_status: 403
    schema:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Permission details
          properties:
            required_permission:
              type: string
              description: Required permission level
            current_permission:
              type: string
              description: Current permission level

  server_error:
    description: Internal server error
    error_code: INTERNAL_ERROR
    http_status: 500
    schema:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Error details
          properties:
            error_id:
              type: string
              description: Unique error identifier for tracking
            error_type:
              type: string
              description: Type of error that occurred

# Tool schemas will be added by specific server implementations
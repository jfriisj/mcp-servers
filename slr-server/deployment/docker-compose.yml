services:
  slr-server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: slr-mcp-server
    ports:
      - "8080:8080"
    environment:
      - DATABASE_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=slr_database
      - POSTGRES_USER=slr_user
      - POSTGRES_PASSWORD=slr_password
      - LOG_LEVEL=INFO
      - MCP_PORT=8080
      - MAX_PAPERS_PER_ANALYSIS=100
    volumes:
      - slr_logs:/app/logs
      - ./papers:/app/papers:ro
    networks:
      - slr-network
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: slr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: slr_database
      POSTGRES_USER: slr_user
      POSTGRES_PASSWORD: slr_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slr_user -d slr_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  slr_logs:
    driver: local
  postgres_data:
    driver: local

networks:
  slr-network:
    driver: bridge
services:
  slr-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slr-mcp-server
    ports:
      - "8080:8080"
    environment:
      - DATABASE_PATH=/app/data/slr_database.db
      - LOG_LEVEL=INFO
      - MCP_PORT=8080
      - MAX_PAPERS_PER_ANALYSIS=100
      - ENABLE_CACHING=true
    volumes:
      - slr_data:/app/data
      - slr_logs:/app/logs
      - ./papers:/app/papers:ro  # Mount papers directory as read-only
    networks:
      - slr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from src.main import SLRMCPServer; print('Production server ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (uncomment if needed)

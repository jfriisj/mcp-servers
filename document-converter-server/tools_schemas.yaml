tools:
  pdf_to_markdown:
    description: Convert a PDF file to markdown format
    input_schema:
      type: object
      required:
        - input_path
        - output_path
      properties:
        input_path:
          type: string
          description: Path to the input PDF file
        output_path:
          type: string
          description: Path where the markdown file should be saved
        preserve_images:
          type: boolean
          description: Whether to extract and save images from the PDF
          default: true
        image_dir:
          type: string
          description: Directory to save extracted images (if preserve_images is true)
          default: images
        table_format:
          type: string
          description: Format to use for tables in markdown output
          enum: [grid, pipe, simple]
          default: pipe

  batch_convert:
    description: Convert multiple PDF files in a directory to markdown
    input_schema:
      type: object
      required:
        - input_dir
        - output_dir
      properties:
        input_dir:
          type: string
          description: Directory containing PDF files to convert
        output_dir:
          type: string
          description: Directory where markdown files should be saved
        recursive:
          type: boolean
          description: Whether to recursively process subdirectories
          default: false
        file_pattern:
          type: string
          description: Pattern to match PDF files (e.g., "*.pdf")
          default: "*.pdf"
        preserve_images:
          type: boolean
          description: Whether to extract and save images from PDFs
          default: true
        parallel:
          type: boolean
          description: Whether to use parallel processing
          default: true
        max_workers:
          type: integer
          description: Maximum number of parallel workers (if parallel is true)
          default: 4

  quick_convert:
    description: Quick one-shot PDF to markdown conversion with minimal configuration
    input_schema:
      type: object
      required:
        - input_path
      properties:
        input_path:
          type: string
          description: Path to the input PDF file
        output_path:
          type: string
          description: Path where the markdown should be saved (defaults to input path with .md extension)
        extract_images:
          type: boolean
          description: Whether to extract images
          default: false

error_responses:
  InvalidPDFError:
    description: The provided PDF file is invalid or corrupted
    error_code: INVALID_PDF
    http_status: 400

  FileNotFoundError:
    description: The specified file or directory does not exist
    error_code: FILE_NOT_FOUND
    http_status: 404

  ConversionError:
    description: An error occurred during the conversion process
    error_code: CONVERSION_ERROR
    http_status: 500

  PermissionError:
    description: Insufficient permissions to read input or write output
    error_code: PERMISSION_DENIED
    http_status: 403
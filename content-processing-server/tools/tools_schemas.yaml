# Content Processing Server Tool Schemas
# Provides tools for processing and enriching educational content

convert_educational_concept:
  name: "convert_educational_concept"
  description: "Convert educational concepts into structured descriptions with rich context"
  inputSchema:
    type: "object"
    properties:
      concept_name:
        type: "string"
        description: "Name of the concept to process"
      category:
        type: "string"
        description: "Category of the concept (e.g., algorithm, pattern, technique)"
        default: "algorithm"
      algorithm_data:
        type: "object"
        description: "Additional data about the algorithm or concept"
        properties:
          complexity:
            type: "object"
            description: "Time and space complexity information"
            properties:
              time:
                type: "string"
                description: "Time complexity (e.g., O(n), O(n log n))"
              space:
                type: "string"
                description: "Space complexity (e.g., O(n), O(1))"
          advantages:
            type: "array"
            description: "List of advantages"
            items:
              type: "string"
          disadvantages:
            type: "array"
            description: "List of disadvantages"
            items:
              type: "string"
          use_cases:
            type: "array"
            description: "List of use cases"
            items:
              type: "string"
          related_algorithms:
            type: "array"
            description: "List of related algorithms"
            items:
              type: "string"
    required: ["concept_name"]

extract_lesson_content:
  name: "extract_lesson_content"
  description: "Extract and analyze AI algorithm content from lesson materials"
  inputSchema:
    type: "object"
    properties:
      input_file:
        type: "string"
        description: "Path to the lesson file to process"
      output_dir:
        type: "string"
        description: "Directory to save extracted content"
        default: "extracted_algorithms"
      algorithms:
        type: "array"
        description: "List of algorithms to search for (if not specified, searches for all known algorithms)"
        items:
          type: "string"
          enum: ["a_star", "fsm", "decision_trees", "behavior_trees"]
      extract_sections:
        type: "array"
        description: "Specific section types to extract"
        items:
          type: "string"
          enum: ["headers", "keywords", "both"]
        default: ["both"]
      section_overlap:
        type: "integer"
        description: "Maximum lines between sections to consider them part of the same content"
        default: 20
      save_extracted:
        type: "boolean"
        description: "Whether to save extracted content to files"
        default: true
    required: ["input_file"]

process_lesson_data:
  name: "process_lesson_data"
  description: "Process lesson data with rich educational descriptions and learning pathways"
  inputSchema:
    type: "object"
    properties:
      lesson_name:
        type: "string"
        description: "Name of the lesson to process"
      lesson_data:
        type: "object"
        description: "Raw lesson data to process"
        properties:
          algorithms_detailed:
            type: "array"
            description: "List of algorithms to process with details"
            items:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Algorithm name"
                description:
                  type: "string"
                  description: "Basic algorithm description"
                category:
                  type: "string"
                  description: "Algorithm category"
                complexity:
                  type: "object"
                  description: "Algorithm complexity"
                  properties:
                    time:
                      type: "string"
                    space:
                      type: "string"
                use_cases:
                  type: "array"
                  items:
                    type: "string"
                advantages:
                  type: "array"
                  items:
                    type: "string"
                disadvantages:
                  type: "array"
                  items:
                    type: "string"
                related_algorithms:
                  type: "array"
                  items:
                    type: "string"
      output_dir:
        type: "string"
        description: "Directory to save processed data"
        default: "lesson_data"
    required: ["lesson_name", "lesson_data"]

process_all_lessons:
  name: "process_all_lessons"
  description: "Process all lesson data in a project with educational descriptions"
  inputSchema:
    type: "object"
    properties:
      project_root:
        type: "string"
        description: "Root directory of the project containing lessons"
        default: "."
      output_dir:
        type: "string"
        description: "Directory to save processed data"
        default: "lesson_data"
      as_primary:
        type: "boolean"
        description: "Whether to save as primary lesson data files"
        default: true
      verbose:
        type: "boolean"
        description: "Enable verbose logging"
        default: false
    required: []
- pattern: "*.md"
  action: categorize
  target_subdir: content

- pattern: "*.py"
  action: move
  target_subdir: code

- pattern: "*_test.py"
  action: move
  target_subdir: tests

- pattern: "example_*.py"
  action: rename
  target_subdir: examples
  rename_template: "{base.prefix:demo_}{base}.py"
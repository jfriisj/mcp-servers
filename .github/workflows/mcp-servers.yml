name: Build and Publish MCP Servers

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io

jobs:
  # Solid Server
  build-solid:
    name: Build SOLID MCP Server
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '@solid') || contains(github.event.head_commit.message, '@all')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/jfriisj/solid-mcp-server
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./solid-server
          file: ./solid-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Import Analysis Server
  build-import-analysis:
    name: Build Import Analysis MCP Server
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '@import-analysis') || contains(github.event.head_commit.message, '@all')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/jfriisj/import-analysis-mcp-server
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./import-analysis-server
          file: ./import-analysis-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Whisper CPU Server (GitHub Container Registry)
  build-whisper-cpu:
    name: Build Whisper CPU MCP Server
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '@whisper-cpu') || contains(github.event.head_commit.message, '@whisper') || contains(github.event.head_commit.message, '@all')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/jfriisj/whisper-mcp-server-cpu
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./whisper-server
          file: ./whisper-server/Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test CPU Docker image
        run: |
          echo "🧪 Testing CPU Docker image..."
          docker run --rm ${{ env.REGISTRY }}/jfriisj/whisper-mcp-server-cpu:latest --help
          
      - name: Check image size
        run: |
          echo "📊 CPU Image size:"
          docker images ${{ env.REGISTRY }}/jfriisj/whisper-mcp-server-cpu:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  # Whisper GPU Server (Docker Hub - larger size allowed)
  build-whisper-gpu:
    name: Build Whisper GPU MCP Server (Docker Hub)
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '@whisper-gpu')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jfriisj/whisper-mcp-server-gpu
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push GPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./whisper-server
          file: ./whisper-server/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test GPU Docker image
        run: |
          echo "🧪 Testing GPU Docker image..."
          docker run --rm jfriisj/whisper-mcp-server-gpu:latest --help
          
      - name: Check image size
        run: |
          echo "📊 GPU Image size:"
          docker images jfriisj/whisper-mcp-server-gpu:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  # Study Buddy Server
  build-study-buddy:
    name: Build Study Buddy MCP Server
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '@study-buddy') || contains(github.event.head_commit.message, '@all')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/jfriisj/study-buddy-mcp-server
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./study_buddy
          file: ./study_buddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Study Buddy Docker image
        run: |
          echo "🧪 Testing Study Buddy MCP server..."
          docker run --rm ${{ env.REGISTRY }}/jfriisj/study-buddy-mcp-server:latest --help
          
      - name: Check image size
        run: |
          echo "📊 Study Buddy Image size:"
          docker images ${{ env.REGISTRY }}/jfriisj/study-buddy-mcp-server:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-solid, build-import-analysis, build-whisper-cpu, build-whisper-gpu, build-study-buddy]
    if: always()
    
    steps:
      - name: Create build summary
        run: |
          echo "## 🏗️ MCP Servers Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Server | Status | Registry |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-solid.result }}" = "success" ]; then
            echo "| SOLID MCP | ✅ Success | GitHub Container Registry |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-solid.result }}" = "skipped" ]; then
            echo "| SOLID MCP | ⏭️ Skipped | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| SOLID MCP | ❌ Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-import-analysis.result }}" = "success" ]; then
            echo "| Import Analysis MCP | ✅ Success | GitHub Container Registry |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-import-analysis.result }}" = "skipped" ]; then
            echo "| Import Analysis MCP | ⏭️ Skipped | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Import Analysis MCP | ❌ Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-whisper-cpu.result }}" = "success" ]; then
            echo "| Whisper CPU MCP | ✅ Success | GitHub Container Registry |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-whisper-cpu.result }}" = "skipped" ]; then
            echo "| Whisper CPU MCP | ⏭️ Skipped | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Whisper CPU MCP | ❌ Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-whisper-gpu.result }}" = "success" ]; then
            echo "| Whisper GPU MCP | ✅ Success | Docker Hub |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-whisper-gpu.result }}" = "skipped" ]; then
            echo "| Whisper GPU MCP | ⏭️ Skipped | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Whisper GPU MCP | ❌ Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-study-buddy.result }}" = "success" ]; then
            echo "| Study Buddy MCP | ✅ Success | GitHub Container Registry |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-study-buddy.result }}" = "skipped" ]; then
            echo "| Study Buddy MCP | ⏭️ Skipped | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Study Buddy MCP | ❌ Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Trigger Commands:" >> $GITHUB_STEP_SUMMARY
          echo "- \`@solid\` - Build SOLID MCP Server" >> $GITHUB_STEP_SUMMARY
          echo "- \`@import-analysis\` - Build Import Analysis MCP Server" >> $GITHUB_STEP_SUMMARY
          echo "- \`@whisper-cpu\` or \`@whisper\` - Build Whisper CPU MCP Server" >> $GITHUB_STEP_SUMMARY
          echo "- \`@whisper-gpu\` - Build Whisper GPU MCP Server (Docker Hub)" >> $GITHUB_STEP_SUMMARY
          echo "- \`@study-buddy\` - Build Study Buddy MCP Server" >> $GITHUB_STEP_SUMMARY
          echo "- \`@all\` - Build all servers except GPU (GitHub size limits)" >> $GITHUB_STEP_SUMMARY
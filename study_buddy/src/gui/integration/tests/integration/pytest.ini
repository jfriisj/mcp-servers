[pytest]
# Integration Test Suite Configuration

# Test paths
testpaths = gui/integration/tests/integration

# Markers
markers =
    integration: Integration test with real server communication
    requires_server: Test requires MCP server to be running
    slow: Slow running test (> 30 seconds) 
    load: Load/performance test with high resource usage
    resilience: Error recovery and resilience test
    connection: Connection lifecycle test
    tools: Tool invocation workflow test
    workflows: End-to-end workflow test
    errors: Error handling test
    performance: Performance benchmark test

# Output options
addopts = -v --tb=short --strict-markers --durations=10 --color=yes

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Async testing
asyncio_mode = auto

# Minimum version
minversion = 7.0
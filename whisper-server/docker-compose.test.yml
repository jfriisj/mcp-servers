version: '3.8'

# Docker Compose configuration for Whisper MCP Server testing
# This configuration is optimized for MCP protocol testing

services:
  whisper-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-mcp-test
    environment:
      # Hugging Face token (set via .env or export)
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-test_token}
      - HF_TOKEN=${HF_TOKEN:-}
      
      # GPU settings
      - USE_GPU=${USE_GPU:-false}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      
      # Processing settings
      - ENABLE_PARALLEL_PROCESSING=${ENABLE_PARALLEL_PROCESSING:-true}
      - MAX_CONCURRENT_TRANSCRIPTIONS=${MAX_CONCURRENT_TRANSCRIPTIONS:-3}
      
      # Model cache
      - HF_HOME=/app/models
      
      # Test mode
      - TEST_MODE=${TEST_MODE:-false}
      
    volumes:
      # Mount test audio files
      - ./audio:/app/audio:ro
      
      # Mount tests directory
      - ./tests:/app/tests:ro
      
      # Mount model cache for persistence
      - whisper_models:/app/models
      
      # Mount source code (for development/testing)
      - ./src:/app/src:ro
      
    # GPU support (optional - comment out if no GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # MCP uses stdio, so we use stdin_open and tty
    stdin_open: true
    tty: true
    
    # Default: Start in MCP mode
    command: ["--mode", "mcp"]
    
  # Alternative service for API mode testing
  whisper-api-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-api-test
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-test_token}
      - HF_TOKEN=${HF_TOKEN:-}
      - USE_GPU=${USE_GPU:-false}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - ENABLE_PARALLEL_PROCESSING=true
      - MAX_CONCURRENT_TRANSCRIPTIONS=3
      - HF_HOME=/app/models
      - TEST_MODE=${TEST_MODE:-false}
    volumes:
      - ./audio:/app/audio:ro
      - ./tests:/app/tests:ro
      - whisper_models:/app/models
      - ./src:/app/src:ro
    ports:
      - "8000:8000"
    command: ["--mode", "api", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  whisper_models:
    driver: local

version: '3.8'

services:
  # GPU-enabled version (local development)
  whisper-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: whisper-api-gpu-server
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - USE_GPU=true
      - ENABLE_PARALLEL_PROCESSING=true
      - MAX_CONCURRENT_TRANSCRIPTIONS=3
      - HF_HOME=/app/models
      - CUDA_VISIBLE_DEVICES=0
      - TEST_MODE=false
    volumes:
      # Mount audio files directory for processing
      - ./audio:/app/audio:ro
      # Mount model cache for persistence
      - whisper_models:/app/models
    # Uncomment to enable GPU support (requires NVIDIA Docker runtime)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Uncomment for GPU runtime
    runtime: nvidia
    ports:
      - "8000:8000"
    command: ["--mode", "api", "--host", "0.0.0.0", "--port", "8000"]

  # CPU-only version (lightweight, for GitHub packages)
  whisper-api-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: whisper-api-cpu-server
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - USE_GPU=false
      - ENABLE_PARALLEL_PROCESSING=false
      - MAX_CONCURRENT_TRANSCRIPTIONS=1
      - HF_HOME=/app/models
      - TEST_MODE=false
    volumes:
      # Mount audio files directory for processing
      - ./audio:/app/audio:ro
      # Mount model cache for persistence
      - whisper_models_cpu:/app/models
    ports:
      - "8001:8000"
    command: ["--mode", "api", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  whisper_models:
    driver: local
  whisper_models_cpu:
    driver: local
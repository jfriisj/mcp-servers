version: '3.8'

services:
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-api-server
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - HF_TOKEN=${HF_TOKEN}
      - USE_GPU=true
      - ENABLE_PARALLEL_PROCESSING=true
      - MAX_CONCURRENT_TRANSCRIPTIONS=3
      - HF_HOME=/app/models
      - CUDA_VISIBLE_DEVICES=0
      - TEST_MODE=false
    volumes:
      # Mount audio files directory for processing
      - ./audio:/app/audio:ro
      # Mount model cache for persistence
      - whisper_models:/app/models
    # Uncomment to enable GPU support (requires NVIDIA Docker runtime)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Uncomment for GPU runtime
    runtime: nvidia
    ports:
      - "8000:8000"
    command: ["--mode", "api", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  whisper_models:
    driver: local
version: '3.8'

services:
  whisper-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-mcp-server
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_TOKEN}
      - USE_GPU=true
      - ENABLE_PARALLEL_PROCESSING=true
      - MAX_CONCURRENT_TRANSCRIPTIONS=3
      - HF_HOME=/app/models
      - CUDA_VISIBLE_DEVICES=0
      - TEST_MODE=false
    volumes:
      # Mount audio files directory for processing
      - ./audio:/app/audio:ro
      # Mount model cache for persistence
      - whisper_models:/app/models
    # Uncomment to enable GPU support (requires NVIDIA Docker runtime)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Uncomment for GPU runtime
    # runtime: nvidia
    ports: []

volumes:
  whisper_models:
    driver: local
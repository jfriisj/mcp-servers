# Ruff MCP Server Tool Schemas (YAML-driven)
# Each tool entry defines a tool exposed by the MCP server.

- name: ruff-check
  description: Run Ruff linter to identify code issues
  inputSchema:
    type: object
    properties:
      path:
        type: string
        description: Path to check (file or directory)
        default: .
      fix:
        type: boolean
        description: Automatically fix issues where possible
        default: false
      format:
        type: string
        enum: [text, json, github, gitlab, junit, sarif]
        description: Output format
        default: text
      select:
        type: string
        description: Comma-separated list of rule codes to select
      ignore:
        type: string
        description: Comma-separated list of rule codes to ignore
      show_fixes:
        type: boolean
        description: Show available fixes for issues
        default: false
    required: []
  handler: ruff-check

- name: ruff-format
  description: Format Python code using Ruff (Black-compatible)
  inputSchema:
    type: object
    properties:
      path:
        type: string
        description: Path to format (file or directory)
        default: .
      check:
        type: boolean
        description: Only check formatting without making changes
        default: false
      diff:
        type: boolean
        description: Show diff of formatting changes
        default: false
    required: []
  handler: ruff-format

- name: ruff-check-diff
  description: Check Ruff issues on changed files only (git diff)
  inputSchema:
    type: object
    properties:
      base:
        type: string
        description: Base commit/branch to compare against
        default: HEAD~1
      format:
        type: string
        enum: [text, json, github]
        description: Output format
        default: text
    required: []
  handler: ruff-check-diff

- name: ruff-show-settings
  description: Show active Ruff configuration settings
  inputSchema:
    type: object
    properties:
      path:
        type: string
        description: Path to show settings for
        default: .
    required: []
  handler: ruff-show-settings

- name: ruff-explain-rule
  description: Explain a specific Ruff rule
  inputSchema:
    type: object
    properties:
      rule:
        type: string
        description: Rule code to explain (e.g., 'E501', 'F401')
    required: [rule]
  handler: ruff-explain-rule

- name: ruff-config
  description: List or describe Ruff configuration options
  inputSchema:
    type: object
    properties:
      option:
        type: string
        description: Specific config option to show (optional)
      output_format:
        type: string
        enum: [text, json]
        description: Output format
        default: text
    required: []
  handler: ruff-config

- name: ruff-linter
  description: List all supported upstream linters
  inputSchema:
    type: object
    properties:
      output_format:
        type: string
        enum: [text, json]
        description: Output format
        default: text
    required: []
  handler: ruff-linter

- name: ruff-clean
  description: Clear Ruff caches
  inputSchema:
    type: object
    properties: {}
    required: []
  handler: ruff-clean

- name: ruff-analyze-graph
  description: Generate dependency/dependent maps for Python files
  inputSchema:
    type: object
    properties:
      files:
        type: array
        items: {type: string}
        description: List of files or directories to include
        default: [.] 
      direction:
        type: string
        enum: [dependencies, dependents]
        description: Direction of the import map
        default: dependencies
      detect_string_imports:
        type: boolean
        description: Attempt to detect imports from string literals
        default: false
      min_dots:
        type: integer
        description: Minimum number of dots in a string import
      preview:
        type: boolean
        description: Enable preview mode
        default: false
      target_version:
        type: string
        enum: [py37, py38, py39, py310, py311, py312, py313, py314]
        description: Minimum Python version that should be supported
      python:
        type: string
        description: Path to a virtual environment
    required: []
  handler: ruff-analyze-graph
